<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B332B"/><stop offset="1" stop-color="#17140F"/></linearGradient>
    <radialGradient id="sun" cx=".78" cy=".12" r=".7"><stop offset="0" stop-color="#FFE3B5" stop-opacity=".45"/><stop offset="1" stop-color="#FFE3B5" stop-opacity="0"/></radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6B4E33"/><stop offset="1" stop-color="#3E2C1C"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="-10" dy="12" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#wall)"/>
  <!-- janela com luz -->
  <rect x="520" y="40" width="210" height="260" rx="4" fill="#2A241E"/>
  <g fill="#E8D6B4" opacity=".75"><rect x="530" y="50" width="92" height="118"/><rect x="628" y="50" width="92" height="118"/><rect x="530" y="174" width="92" height="116"/><rect x="628" y="174" width="92" height="116"/></g>
  <polygon points="530,300 730,300 560,500 240,500" fill="#FFE3B5" opacity=".08"/>
  <rect width="800" height="500" fill="url(#sun)"/>
  <!-- prateleira com livros -->
  <rect x="60" y="120" width="360" height="10" fill="#5A4430"/>
  <g filter="url(#sh)"><rect x="80" y="62" width="22" height="58" fill="#C5A880"/><rect x="104" y="70" width="18" height="50" fill="#E5D9C5"/><rect x="124" y="58" width="26" height="62" fill="#5E5A55"/><rect x="152" y="74" width="16" height="46" fill="#8E7A5E"/><rect x="190" y="80" width="40" height="40" rx="20" fill="#E5D9C5" opacity=".85"/></g>
  <!-- bancada -->
  <rect x="0" y="360" width="800" height="140" fill="url(#wood)"/>
  <rect x="0" y="360" width="800" height="6" fill="#8A6A48"/>
  <!-- xícaras -->
  <g filter="url(#sh)">
    <ellipse cx="300" cy="372" rx="70" ry="14" fill="#E9E1D3"/>
    <path d="M250 300 h100 v48 a50 30 0 0 1 -100 0z" fill="#F4EFEA"/>
    <ellipse cx="300" cy="300" rx="50" ry="10" fill="#3B2A1E"/>
    <path d="M350 312 a18 18 0 0 1 0 30" stroke="#F4EFEA" stroke-width="8" fill="none"/>
  </g>
  <g filter="url(#sh)">
    <rect x="430" y="290" width="70" height="80" rx="8" fill="#2E2A26"/>
    <rect x="440" y="306" width="50" height="18" rx="3" fill="#C5A880"/>
  </g>
  <!-- vapor -->
  <path d="M290 280 c-10 -20 10 -30 0 -50 M310 284 c-10 -20 10 -30 0 -50" stroke="#F4EFEA" stroke-opacity=".25" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- placa -->
  <text x="60" y="230" font-family="Cinzel, serif" font-size="44" fill="#E5D9C5" letter-spacing="6">CASA OFÍCIO</text>
  <text x="62" y="262" font-family="Inter, sans-serif" font-size="16" fill="#C5A880" letter-spacing="5">CAFÉ · ATELIÊ · ENCONTROS</text>
</svg>
