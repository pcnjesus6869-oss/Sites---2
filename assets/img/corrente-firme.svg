<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4540"/><stop offset="1" stop-color="#1E1C1A"/></linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .18 0"/></filter>
    <linearGradient id="rh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9A9DA3"/><stop offset=".4" stop-color="#3A3C40"/><stop offset=".7" stop-color="#16171A"/><stop offset="1" stop-color="#6E7178"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="-14" dy="20" stdDeviation="10" flood-color="#000" flood-opacity=".6"/></filter>
    <g id="a"><ellipse rx="34" ry="22" fill="none" stroke="url(#rh)" stroke-width="12"/></g>
    <g id="b"><ellipse rx="34" ry="8" fill="none" stroke="url(#rh)" stroke-width="12"/></g>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" filter="url(#grain)"/>
  <polygon points="520,0 800,0 800,1000 180,1000" fill="#fff" opacity=".05"/>
  <g filter="url(#sh)" transform="rotate(-28 400 500)">
    <use href="#a" x="400" y="90"/><use href="#b" x="400" y="140" transform="rotate(90 400 140)"/>
    <use href="#a" x="400" y="190"/><use href="#b" x="400" y="240" transform="rotate(90 400 240)"/>
    <use href="#a" x="400" y="290"/><use href="#b" x="400" y="340" transform="rotate(90 400 340)"/>
    <use href="#a" x="400" y="390"/><use href="#b" x="400" y="440" transform="rotate(90 400 440)"/>
    <use href="#a" x="400" y="490"/><use href="#b" x="400" y="540" transform="rotate(90 400 540)"/>
    <use href="#a" x="400" y="590"/><use href="#b" x="400" y="640" transform="rotate(90 400 640)"/>
    <use href="#a" x="400" y="690"/><use href="#b" x="400" y="740" transform="rotate(90 400 740)"/>
    <use href="#a" x="400" y="790"/><use href="#b" x="400" y="840" transform="rotate(90 400 840)"/>
    <use href="#a" x="400" y="890"/>
  </g>
</svg>
