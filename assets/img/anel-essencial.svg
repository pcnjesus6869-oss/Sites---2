<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8F8A84"/><stop offset="1" stop-color="#5E5A55"/></linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .2  0 0 0 0 .2  0 0 0 0 .2  0 0 0 .35 0"/></filter>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#C9CCD1"/><stop offset=".6" stop-color="#7D828A"/><stop offset=".85" stop-color="#E9EBEE"/><stop offset="1" stop-color="#A7ABB2"/></linearGradient>
    <radialGradient id="spot" cx=".6" cy=".35" r=".7"><stop offset="0" stop-color="#FFF6E6" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="-24" dy="30" stdDeviation="14" flood-color="#1c1a18" flood-opacity=".55"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" filter="url(#grain)"/>
  <rect width="800" height="1000" fill="url(#spot)"/>
  <!-- sombra marcada (luz natural forte) -->
  <polygon points="0,0 260,0 800,640 800,1000 700,1000 0,180" fill="#000" opacity=".12"/>
  <g filter="url(#sh)">
    <ellipse cx="400" cy="560" rx="190" ry="120" fill="none" stroke="url(#silver)" stroke-width="44"/>
    <ellipse cx="400" cy="560" rx="190" ry="120" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-dasharray="180 900" stroke-dashoffset="-40"/>
    <path d="M226 590 a190 120 0 0 0 348 0" fill="none" stroke="#5F646B" stroke-opacity=".5" stroke-width="10"/>
  </g>
</svg>
