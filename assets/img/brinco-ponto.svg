<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4D7C3"/><stop offset="1" stop-color="#A8967C"/></linearGradient>
    <pattern id="linen" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 2.5h5M2.5 0v5" stroke="#fff" stroke-opacity=".14"/></pattern>
    <radialGradient id="gold" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#FFF1CF"/><stop offset=".4" stop-color="#D7B271"/><stop offset=".8" stop-color="#8F6E35"/><stop offset="1" stop-color="#C9A462"/></radialGradient>
    <linearGradient id="hook" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9C7A3E"/><stop offset=".5" stop-color="#F3DEB0"/><stop offset="1" stop-color="#9C7A3E"/></linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="16" dy="20" stdDeviation="10" flood-color="#4a3a26" flood-opacity=".45"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#linen)"/>
  <!-- óculos de sol -->
  <g opacity=".9" filter="url(#sh)">
    <ellipse cx="560" cy="210" rx="110" ry="80" fill="#1d1a17"/>
    <ellipse cx="560" cy="210" rx="110" ry="80" fill="none" stroke="#6b5a45" stroke-width="10"/>
    <path d="M450 200 C 400 180, 360 190, 320 220" stroke="#6b5a45" stroke-width="10" fill="none"/>
    <ellipse cx="530" cy="180" rx="40" ry="18" fill="#fff" opacity=".12"/>
  </g>
  <g filter="url(#sh)">
    <path d="M300 430 q -40 -80 0 -120" stroke="url(#hook)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="300" cy="500" r="70" fill="url(#gold)"/>
    <path d="M500 520 q -40 -80 0 -120" stroke="url(#hook)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="500" cy="590" r="70" fill="url(#gold)"/>
  </g>
</svg>
