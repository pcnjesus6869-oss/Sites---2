<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2C2724"/><stop offset="1" stop-color="#121110"/></linearGradient>
    <radialGradient id="glow" cx=".7" cy=".3" r=".6"><stop offset="0" stop-color="#FFE9C6" stop-opacity=".28"/><stop offset="1" stop-color="#FFE9C6" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E2B6"/><stop offset=".45" stop-color="#C9A462"/><stop offset=".75" stop-color="#8F6E35"/><stop offset="1" stop-color="#E7C98C"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000" flood-opacity=".6"/></filter>
    <g id="link"><rect x="-34" y="-20" width="68" height="40" rx="20" fill="none" stroke="url(#gold)" stroke-width="10"/></g>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
