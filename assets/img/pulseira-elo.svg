      <g transform="rotate(135) translate(0 -230)"><rect x="-14" y="-24" width="28" height="48" rx="6" fill="url(#gold)"/></g>
      <g transform="rotate(165) translate(0 -230)"><rect x="-14" y="-24" width="28" height="48" rx="6" fill="url(#gold)"/></g>
      <g transform="rotate(195) translate(0 -230)"><rect x="-14" y="-24" width="28" height="48" rx="6" fill="url(#gold)"/></g>
      <g transform="rotate(225) translate(0 -230)"><rect x="-14" y="-24" width="28" height="48" rx="6" fill="url(#gold)"/></g>
      <g transform="rotate(255) translate(0 -230)"><rect x="-14" y="-24" width="28" height="48" rx="6" fill="url(#gold)"/></g>
