<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EDE3D3"/><stop offset="1" stop-color="#C9B89C"/></linearGradient>
    <pattern id="linen" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 3h6M3 0v6" stroke="#fff" stroke-opacity=".12" stroke-width="1"/></pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3DEB0"/><stop offset=".45" stop-color="#C9A462"/><stop offset=".7" stop-color="#9C7A3E"/><stop offset="1" stop-color="#E8CC92"/></linearGradient>
    <radialGradient id="light" cx=".25" cy=".2" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="10" dy="14" stdDeviation="8" flood-color="#5a4630" flood-opacity=".35"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#linen)"/>
  <!-- xícara de cerâmica -->
  <g filter="url(#sh)">
    <circle cx="640" cy="170" r="120" fill="#F7F2EA"/>
    <circle cx="640" cy="170" r="92" fill="#3B2A1E"/>
    <circle cx="640" cy="170" r="92" fill="url(#light)"/>
    <rect x="745" y="150" width="70" height="40" rx="20" fill="#F7F2EA"/>
  </g>
  <!-- livro -->
  <rect x="-40" y="700" width="330" height="420" rx="6" fill="#2E2A26" transform="rotate(-12 120 900)" filter="url(#sh)"/>
  <!-- colar -->
  <g filter="url(#sh)" fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M190 260 C 200 560, 330 690, 420 700 C 510 690, 620 560, 610 300" stroke-width="7" stroke-dasharray="1 13"/>
    <path d="M190 260 C 200 560, 330 690, 420 700 C 510 690, 620 560, 610 300" stroke-width="3"/>
  </g>
  <g filter="url(#sh)">
    <path d="M420 700 l0 26" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="420" cy="770" r="44" fill="url(#gold)"/>
    <circle cx="420" cy="770" r="30" fill="none" stroke="#F6E6C2" stroke-opacity=".7" stroke-width="2"/>
    <text x="420" y="781" font-family="Cinzel, serif" font-size="28" text-anchor="middle" fill="#7A5B2A">V</text>
  </g>
  <rect width="800" height="1000" fill="url(#light)"/>
</svg>
